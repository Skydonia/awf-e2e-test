name: Repository quality gate
on:
  pull_request:
    branches: [develop]
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      - name: Prepare project
        run: bash .agent/setup-project.sh
      - name: Validate test
        run: python -m pytest
      - name: Validate build
        run: python -m build
  telemetry:
    name: AWF telemetry (non-blocking)
    needs: [quality-gate]
    if: ${{ always() }}
    uses: ./.github/workflows/awf-episode-completed.yml
    with:
      telemetry_enabled: ${{ vars.AWF_TELEMETRY_ENABLED }}
      control_tower_repository: ${{ vars.AWF_CONTROL_TOWER_REPOSITORY }}
      source_repository: ${{ github.repository }}
      pull_request_number: ${{ github.event.pull_request.number }}
      source_run_id: ${{ github.run_id }}
    secrets:
      control_tower_token: ${{ secrets.AWF_CONTROL_TOWER_TOKEN }}
