name: Repository quality gate
on:
  pull_request:
    branches: [develop]
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      - name: Prepare project
        run: bash .agent/setup-project.sh
      - name: Validate test
        run: python -m pytest
      - name: Validate build
        run: python -m build
