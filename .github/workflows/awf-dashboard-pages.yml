name: AWF Repository Dashboard

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awf-dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.AWF_DASHBOARD_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      CONTROL_TOWER_REPOSITORY: ${{ vars.AWF_CONTROL_TOWER_REPOSITORY || fromJSON('"Skydonia/control_tower"') }}
      CONTROL_TOWER_REF: "dcada8e72f03bfa2cfd0f0fbf7f1019d119335fe"
      CONTROL_TOWER_FRONTEND_MANIFEST_SHA256: "17a35d2330fec81c32a39bb99dcf48825c31d4f8cb6e33bf7f3e2d0dd2bdd0e9"
    steps:
      - name: Verify private Control Tower access
        shell: bash
        env:
          AWF_CONTROL_TOWER_TOKEN: ${{ secrets.AWF_CONTROL_TOWER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AWF_CONTROL_TOWER_TOKEN:-}" ]; then
            echo "::error title=Control Tower access::AWF_CONTROL_TOWER_TOKEN is missing"
            exit 1
          fi
          status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $AWF_CONTROL_TOWER_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$CONTROL_TOWER_REPOSITORY/commits/$CONTROL_TOWER_REF"
          )"
          if [ "$status" != "200" ]; then
            echo "::error title=Control Tower access::Unable to read the private Control Tower repository/ref (HTTP $status)"
            exit 1
          fi

      - name: Checkout Control Tower code
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CONTROL_TOWER_REPOSITORY }}
          ref: ${{ env.CONTROL_TOWER_REF }}
          token: ${{ secrets.AWF_CONTROL_TOWER_TOKEN }}
          path: control-tower
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout private telemetry
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CONTROL_TOWER_REPOSITORY }}
          ref: telemetry
          token: ${{ secrets.AWF_CONTROL_TOWER_TOKEN }}
          path: telemetry
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: control-tower/pyproject.toml

      - name: Install the versioned Control Tower builder
        run: python -m pip install ./control-tower

      - name: Verify the pinned frontend contract
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            "$CONTROL_TOWER_FRONTEND_MANIFEST_SHA256" \
            control-tower/frontend/frontend-manifest.json \
            | sha256sum --check --strict

      - name: Build this repository dashboard only
        shell: bash
        run: |
          set -euo pipefail
          code_sha=$(git -C control-tower rev-parse HEAD)
          telemetry_sha=$(git -C telemetry rev-parse HEAD)
          python -m control_tower.pages \
            --telemetry-root telemetry \
            --output "$RUNNER_TEMP/awf-dashboard-site" \
            --schema control-tower/schemas/episode-v1.schema.json \
            --policy control-tower/config/pages-publication.json \
            --frontend control-tower/frontend \
            --code-sha "$code_sha" \
            --telemetry-sha "$telemetry_sha" \
            --repository-filter "$GITHUB_REPOSITORY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload repository-only Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/awf-dashboard-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy repository dashboard
        id: deployment
        uses: actions/deploy-pages@v4
